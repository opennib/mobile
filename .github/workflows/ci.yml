name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck + bare bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      # Bundles the opennib Bare worker for ios-arm64 / ios-arm64-simulator /
      # android-arm64 with bare-pack. Runs under Node; no device needed.
      - run: npm run bundle:bare
